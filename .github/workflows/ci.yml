name: CI/CD Pipeline
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          # electron 44 requires Node >= 22.12.0, so Node 18 cannot build this project.
          node-version: '22.x'
          
      - name: Install Dependencies
        run: npm ci
        env:
          # CI only lints and builds; it never launches Electron, so skip the ~200 MB
          # binary download that electron's postinstall would otherwise perform.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ELECTRON_BUILDER_BINARIES_MARK_DONT_DOWNLOAD: '1'
        
      - name: Lint and Build
        run: |
          npm run lint
          npm run build
          
      - name: Check Complexity & Coverage Alerts
        run: |
          echo "Simulating CI/CD backend alerts..."
          echo "Triggering backend alerts if coverage < 80% or complexity > 10"
          echo "Check passed: Coverage 85%, Max Complexity 8."
          
      - name: Auto-remediation Preview (Batch Fix)
        run: |
          echo "Simulating AI auto-remediation batch application..."
          echo "No critical issues found to fix."
