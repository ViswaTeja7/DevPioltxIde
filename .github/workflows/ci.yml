name: CI

on: [push, pull_request]

env:
  # macOS runners have only 7 GB RAM, so Node derives a ~2 GB default V8 heap there;
  # vite's transform phase for this app peaks just past that and aborts the build with
  # "FATAL ERROR: Ineffective mark-compacts near heap limit" (exit 134). Windows/Linux
  # runners have 16 GB (≈4 GB heap) and pass, and the macOS quality build only squeaked
  # under the cap. Raise the limit for every step so typecheck, tests and builds all
  # have headroom on every OS.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Lint, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The desktop app ships for all three platforms; it must build on all three.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # electron 44 requires Node >= 22.12.0, so Node 18 cannot build this project.
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts because CI only lints, tests and builds, and never runs the app:
        #   * skips electron's ~200 MB binary download
        #   * skips node-pty's native build. node-pty ships prebuilds for win32 and darwin
        #     only, so on Linux its install script falls back to `node-gyp rebuild` and
        #     needs a full C++ toolchain. Neither binary is needed here: esbuild marks
        #     node-pty external, and its typings still ship inside the package.
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run lint

      - name: Unit tests with coverage
        # Real coverage with enforced thresholds (see vitest.config.ts). This replaced
        # the previous placeholder step that echoed a hardcoded "85%" without running
        # a single test.
        run: npm run test:coverage

      - name: Dependency audit
        # Fail on high/critical vulnerabilities in production dependencies.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS only: node-pty ships prebuilt binaries for those platforms,
        # so the PTY-backed backend starts without a C++ toolchain. On Linux the module
        # has to be compiled from source, which CI deliberately avoids.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the application
        run: npm run build

      - name: Run Playwright smoke tests
        run: npm run test:e2e
        env:
          CI: 'true'
          DEVPILOTX_DISABLE_GPU: '1'

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: test-results/
          retention-days: 7

