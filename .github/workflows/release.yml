name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release the updater reads

env:
  # Same ~2 GB default V8 heap on 7 GB macOS runners as in CI; raise it so
  # `npm run build`'s vite transform phase does not OOM during release builds.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win
          - os: macos-latest
            builder_args: --mac
          - os: ubuntu-latest
            builder_args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        # Native modules are rebuilt for Electron's ABI by electron-builder itself, so
        # install-time scripts can stay off here.
        run: npm ci --ignore-scripts

      - name: Verify quality gates
        run: |
          npm run lint
          npm run test

      - name: Build & publish installers
        # electron-builder signs automatically when the signing variables are present,
        # and uploads the installers plus the update metadata (latest.yml / *.blockmap)
        # the in-app auto-updater consumes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows (Azure Trusted Signing preferred; PFX also supported)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.builder_args }} --publish always

      - name: Generate SBOM
        run: npm run sbom > sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}
          path: sbom-cyclonedx.json
          retention-days: 90
